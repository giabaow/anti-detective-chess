[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anti-cheat-detective"
version = "0.1.0"
description = "Explainable chess engine-assistance research prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "python-chess>=1.999,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]
modeling = [
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "shap>=0.47,<1",
  "xgboost>=3,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/anti_cheat_detective"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

